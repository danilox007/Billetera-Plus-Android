
name: Build Billetera Plus APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descomprimir proyecto
        run: |
          mkdir -p proyecto
          unzip -o BilleteraPlus_proyecto_completo.zip -d proyecto

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle -p proyecto/BilleteraPlus assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: BilleteraPlus-APK
          path: proyecto/BilleteraPlus/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
