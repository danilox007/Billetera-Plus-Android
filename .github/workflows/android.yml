
name: Build Billetera Plus APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Revisar archivos del repositorio
        run: |
          echo "Archivos disponibles:"
          ls -la
          echo "Contenido del ZIP:"
          unzip -l BilleteraPlus_proyecto_completo.zip | head -60

      - name: Revisar ZIP sin compilar
        run: |
          mkdir -p proyecto
          unzip -o BilleteraPlus_proyecto_completo.zip -d proyecto
          echo "Archivos encontrados dentro del ZIP:"
          find proyecto -maxdepth 5 -type f | head -100
